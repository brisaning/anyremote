[package]
name = "anyremote-codec"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Backend VP9 real (ciclo C3-bis): shiguredo_libvpx trae binario precompilado (Apache-2.0).
vpx = ["dep:shiguredo_libvpx"]

[dependencies]
anyremote-capture = { workspace = true }
flate2 = "1"
openh264 = "0.9.9"
shiguredo_libvpx = { version = "2026.2.0-canary.3", optional = true }

[target.'cfg(windows)'.dependencies]
# C-14: Media Foundation (H.264 HW con fallback a VP9).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_MediaFoundation",
] }
