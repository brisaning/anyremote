// ARSP — anyremote session protocol (D-05). Esquema propio; patrones de referencia:
// H-RD-01 (handshake sesión), H-RD-03 (permisos), RF-01. Clean-room D-01.
syntax = "proto3";
package arsp;

// Envelope: marco lógico de cada mensaje de sesión sobre un frame de transporte.
message Envelope {
  uint64 seq = 1;
  oneof payload {
    Auth auth = 8;
    Hello hello = 10;
    Welcome welcome = 11;
    PermissionRequest permission_request = 12;
    PermissionResponse permission_response = 13;
    Heartbeat heartbeat = 14;
    Bye bye = 15;
    VideoFrame video_frame = 16;
    InputEventMsg input_event = 17;
    ClipboardSync clipboard = 18;
    FileOffer file_offer = 19;
    FileChunk file_chunk = 20;
    FileDone file_done = 21;
    FileReady file_ready = 22;
    AudioFrame audio_frame = 23;
    InputAck input_ack = 24;
  }
}

// Oferta de transferencia de archivos (RF-02c, ciclo C5; límites patrón H-RD-08).
message FileOffer {
  uint64 transfer_id = 1;
  string name = 2;
  uint64 size = 3;
  bytes sha256 = 4;   // 32 bytes
}

// Chunk con offset absoluto (la reanudación usa el último offset confirmado).
message FileChunk {
  uint64 transfer_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

// Resultado de la transferencia (hash verificado por el receptor).
message FileDone {
  uint64 transfer_id = 1;
  bool ok = 2;
  string detail = 3;
}

// Aceptación de la oferta: offset desde el que enviar (0 = archivo nuevo;
// >0 = reanudación desde un parcial persistido entre sesiones).
message FileReady {
  uint64 transfer_id = 1;
  uint64 resume_offset = 2;
}

// Formato de portapapeles admitido (contención C4: solo texto; otros = rechazo).
enum ClipboardFormatEnum {
  CLIP_TEXT = 0;
}

// Sincronización de portapapeles (RF-02b, ciclo C4).
message ClipboardSync {
  uint64 revision = 1;
  ClipboardFormatEnum format = 2;
  bytes utf8 = 3;
}

// Formato del códec de vídeo (espejo de anyremote-codec::CodecFormat).
enum CodecFormatEnum {
  RAW_CODEC = 0;
  DEFLATE_CODEC = 1;
  VP9_CODEC = 2;
}

// Frame de vídeo empaquetado (ciclo C3, RF-02a).
message VideoFrame {
  uint64 seq = 1;
  uint32 width = 2;
  uint32 height = 3;
  CodecFormatEnum format = 4;
  bytes data = 5;
}

// Acuse de entrada (RF-02a): el controlado confirma si el evento se INYECTÓ
// (ok) o por qué se rechazó → el visor sabe si el control realmente actúa.
message InputAck {
  bool ok = 1;
  string perm = 2;   // permiso evaluado (keyboard/mouse); vacío si no llegó a evaluar
  string detail = 3; // motivo si !ok: toggle_apagado | no_concedido | unsupported | error; vacío si ok
}

// Evento de entrada remoto (RF-02a; inyección bajo permiso D-07).
message InputEventMsg {
  oneof ev {
    Key key = 1;
    Pointer pointer = 2;
    Button button = 3;
  }
}

message Key {
  // Tabla de códigos compartida app↔daemon (RF-02a; la convierte
  // anyremote-transport::arsp::input_event_from_wire al modelo de inyección):
  //   0 = tecla de carácter → usar `ch` (un solo codepoint UTF-8)
  //   1=escape 2=tab 3=enter 4=backspace 5=delete
  //   6=left 7=right 8=up 9=down 10=home 11=end
  //   20=ctrl 21=alt 22=shift
  //   30..41 = F1..F12
  uint32 code = 1;
  bool down = 2;
  bool extended = 3;  // reservado (el backend win32 infiere la extensión de la tecla)
  // Carácter UTF-8 de un solo codepoint cuando code=0 (ej. "a", "A", "1").
  string ch = 4;
}

message Pointer {
  // `absolute` = posición normalizada 0..65535 de pantalla (ejes X/Y): el wire
  // no depende de la resolución del vídeo ni de la del anfitrión (fix v0.6.2:
  // con píxeles de frame, el control se perdía al ir el vídeo escalado).
  int32 x = 1;
  int32 y = 2;
  bool absolute = 3;
}

message Button {
  uint32 button = 1; // 0=izq 1=der 2=medio
  bool down = 3;
  int32 wheel = 4;
}

// Frame de audio empaquetado (audio en sesión; D-05 ya preveía `AudioFrame`).
// Por sesión se fija 48 kHz mono (Opus, frames de 20 ms).
enum AudioCodecEnum {
  AUDIO_OPUS = 0;
}

message AudioFrame {
  uint64 seq = 1;
  uint32 sample_rate = 2;   // siempre 48000 en esta versión
  uint32 channels = 3;      // siempre 1 (mono)
  AudioCodecEnum format = 4;
  bytes data = 5;           // payload Opus
}

// Prueba de identidad ed25519 vinculada al canal TLS (D-03, patrón H-RD-02 id_pk).
// `signature` = ed25519("anyremote-auth-v1" || len(binding) || binding) con la clave
// cuyo hash deriva en `node_id`; `binding` debe ser idéntico al exportado por el receptor.
message Auth {
  string node_id = 1;
  bytes pubkey = 2;
  bytes signature = 3;
  bytes binding = 4;
}

// Controlador -> controlado al abrir sesión.
message Hello {
  uint32 proto_version = 1;
  string node_id = 2;
  string session_hint = 3;
}

// Controlado -> controlador: acepta la sesión y publica capacidades.
message Welcome {
  uint32 proto_version = 1;
  string node_id = 2;
  SessionCapabilities capabilities = 3;
}

message SessionCapabilities {
  bool keyboard = 1;
  bool mouse = 2;
  bool clipboard = 3;
  bool audio = 4;
  bool files = 5;
  // Códecs de vídeo que el emisor puede decodificar (negociación, patrón H-RD-05).
  repeated CodecFormatEnum supported_codecs = 6;
}

// Controlado -> controlador: solicita permisos concretos (D-07, denegado por defecto).
message PermissionRequest {
  repeated string permissions = 1;
}

// Controlador -> controlado: concesión explícita por permiso.
message PermissionResponse {
  bool granted = 1;
  repeated string permissions = 2;
}

// Latidos con eco para métricas de enlace (RTT) — RF-05 base.
message Heartbeat {
  uint64 seq = 1;
  int64 sent_unix_ms = 2;
  bool echo = 3;
}

// Cierre ordenado de sesión.
message Bye {
  string reason = 1;
}
