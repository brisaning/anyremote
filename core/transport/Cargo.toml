[package]
name = "anyremote-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyremote-identity = { workspace = true }
anyremote-session = { workspace = true }
anyremote-codec = { workspace = true }
anyremote-clipboard = { workspace = true }
anyremote-filexfer = { workspace = true }
anyremote-input = { workspace = true }
anyremote-audio = { workspace = true }
rustls-pemfile = "2"
sha2 = "0.10"
data-encoding = "2"
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rcgen = "0.13"
prost = "0.13"
# C-15: QUIC. Sin `platform-verifier`/`bloom`/`log` (la confianza es TOFU con
# pin propio — `cert_store` — y la autenticación real la ancla C2, igual que
# en TCP; ver specs/02 §8). Solo runtime tokio + crypto rustls-ring.
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
if-addrs = "0.15"

[features]
default = []
# Activa el backend VP9 en el pipeline de transporte (gate C3-bis).
vpx = ["anyremote-codec/vpx"]

[build-dependencies]
prost-build = "0.13"
protox = "0.7"

[dev-dependencies]
anyremote-session = { workspace = true }
anyremote-capture = { workspace = true }
anyremote-codec = { workspace = true }
anyremote-telemetry = { workspace = true }
serde_json = "1"
