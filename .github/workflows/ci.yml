name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# El proyecto es Windows-only (DXGI, WASAPI, SendInput, Flutter Windows):
# los gates corren en windows-latest (MSVC + Windows SDK + CMake preinstalados;
# CMake es necesario para libvpx/shiguredo y opusic-sys).
jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt (formato)
        run: cargo fmt --check
        working-directory: core
      - name: clippy (avisos como errores)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: core
      - name: tests
        run: cargo test --workspace
        working-directory: core

  flutter:
    name: Flutter (analyze + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: dependencias
        run: flutter pub get
        working-directory: app
      - name: analyze
        run: flutter analyze
        working-directory: app
      - name: test
        run: flutter test
        working-directory: app

  # C-17: el servidor de encuentro (rendezvous + relay) es portable (solo
  # tokio/serde/identity) — se construye en Linux porque ahí se despliega (VPS
  # del usuario). El artefacto queda en los runs de CI para descargar.
  rdv-linux:
    name: anyremote-rdv (build Linux para VPS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rdv-linux
      - name: build servidor de encuentro
        run: cargo build --release -p anyremote-rendezvous --bin anyremote-rdv
        working-directory: core
      - uses: actions/upload-artifact@v4
        with:
          name: anyremote-rdv-linux-x86_64
          path: core/target/release/anyremote-rdv
          if-no-files-found: error
